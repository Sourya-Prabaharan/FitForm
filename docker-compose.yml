services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitform
      POSTGRES_PASSWORD: fitform
      POSTGRES_DB: fitform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitform -d fitform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./validation-videos:/validation-videos
      - fitform-videos:/tmp/fitform-videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./validation-videos:/validation-videos
      - fitform-videos:/tmp/fitform-videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

volumes:
  postgres-data:
  fitform-videos:
