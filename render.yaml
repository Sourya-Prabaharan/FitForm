# Optional paid hosting. compose.production.yml supports existing hardware instead.
envVarGroups:
  - name: fitform-email
    envVars:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false

services:
  - type: web
    name: fitform-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port "$PORT" --proxy-headers --forwarded-allow-ips="*"'
    healthCheckPath: /ready
    envVars:
      - fromGroup: fitform-email
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitform-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fitform-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '[]'
      - key: TRUSTED_HOSTS
        value: '[".onrender.com","localhost","127.0.0.1"]'
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "250"

  - type: worker
    name: fitform-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    envVars:
      - fromGroup: fitform-email
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitform-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fitform-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '[]'
      - key: TRUSTED_HOSTS
        value: '[".onrender.com","localhost","127.0.0.1"]'
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "250"

  - type: keyvalue
    name: fitform-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: fitform-postgres
    plan: starter
    databaseName: fitform
    user: fitform
